<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Safety Cage Field Operations</title>
<style>
:root{--red:#e30613;--ink:#111;--line:#e1e5e3;--bg:#f5f6f5}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.shell{height:100vh;display:grid;grid-template-rows:58px 1fr}
.bridge{background:#111;color:#fff;border-top:4px solid var(--red);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;box-shadow:0 2px 12px rgba(0,0,0,.18);z-index:10}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand b{font-size:15px}.brand small{display:block;color:#aaa;font-size:10px;text-transform:uppercase;letter-spacing:.12em;margin-top:2px}
.actions{display:flex;gap:8px;align-items:center}.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border-radius:9px;padding:9px 12px;font-size:12px;font-weight:900;white-space:nowrap}.back{background:#fff;color:#111}.open{background:var(--red);color:#fff}
.frame{width:100%;height:100%;border:0;background:#fff}
@media(max-width:650px){.shell{grid-template-rows:64px 1fr}.bridge{padding:8px 10px}.brand small{display:none}.open{display:none}.btn{padding:9px 10px}}
</style>
</head>
<body>
<div class="shell">
  <header class="bridge">
    <div class="brand"><div><b>Safety Cage</b><small>Command Center → Field Operations</small></div></div>
    <div class="actions">
      <a class="btn back" href="index.html#trifecta">← Client Dashboard</a>
      <a class="btn open" href="https://safety-cage-360.vercel.app/?v=14" target="_blank" rel="noopener">Open Full Screen ↗</a>
    </div>
  </header>
  <iframe class="frame" src="https://safety-cage-360.vercel.app/?v=14" title="Safety Cage Field Operations" allow="geolocation; camera" referrerpolicy="strict-origin-when-cross-origin"></iframe>
</div>
</body>
</html>
